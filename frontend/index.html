<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ref.py explained: SIMON and SPECK</title>
<meta name="description" content="A guided, visual debugger for a Python reference implementation of the SIMON and SPECK lightweight block ciphers.">
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --panel-2:#efede7; --ink:#1a1c20; --ink-2:#454b55; --ink-3:#626873; --line:#d9d5cb;
  --bit1:#22262c; --bit0:#dcd9d0; --code-bg:#fbfaf7;
  --simon:#0b5fa5; --speck:#b23c0a; --on-accent:#ffffff;
  --ok:#19713a; --bad:#b42318; --bad-bg:#fdecea; --ok-bg:#e8f4ec;
  --k-kw:#7c3aed; --k-str:#2e7d32; --k-num:#a14a00; --k-com:#6b7280; --k-fn:#0f6e66; --k-bi:#9d174d; --k-const:#8a5a00;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --topbar-h:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121418; --panel:#1a1d22; --panel-2:#23272e; --ink:#e9e7e2; --ink-2:#c3c6cc; --ink-3:#9096a0; --line:#343841;
    --bit1:#eceae4; --bit0:#3a3f48; --code-bg:#16191d;
    --simon:#4a94d8; --speck:#d96f33; --on-accent:#111317;
    --ok:#5fd08a; --bad:#ff7b72; --bad-bg:#3a1d1c; --ok-bg:#16301f;
    --k-kw:#c4a7ff; --k-str:#8fd694; --k-num:#f0b46c; --k-com:#8b93a1; --k-fn:#6fd3c6; --k-bi:#f49ac1; --k-const:#e8c37a;
    color-scheme:dark;
  }
}
body{--accent:var(--simon)}
body[data-cipher="speck"]{--accent:var(--speck)}
.c-simon{--accent:var(--simon)} .c-speck{--accent:var(--speck)}
body,.c-simon,.c-speck{--tint:color-mix(in srgb,var(--accent) 13%,transparent);--tint-2:color-mix(in srgb,var(--accent) 26%,transparent)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--font);-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}
a{color:var(--accent)}
code,kbd,pre,samp{font-family:var(--mono);font-size:.9em}
p code,li code,td code,dd code,h3 code,.say code,summary code{background:var(--panel-2);padding:.05em .3em;border-radius:4px}
h1,h2,h3,h4{line-height:1.25;margin:0}
h3{font-size:1.12rem;margin:2rem 0 .6rem}
h4{font-size:.98rem;margin:1.2rem 0 .4rem}
p{margin:.5rem 0 .8rem}
ul,ol{padding-left:1.3rem}
li{margin:.2rem 0}
dfn{font-style:normal;font-weight:650}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono)}
.nowrap{white-space:nowrap}
.skip{position:absolute;left:-9999px;top:.5rem;z-index:100;background:var(--panel);color:var(--ink);padding:.5rem 1rem;border-radius:8px;border:2px solid var(--accent)}
.skip:focus{left:.5rem}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:1.2rem .9rem 1.5rem;display:flex;flex-direction:column;gap:1rem}
.brand .kicker{margin:0;font:600 .72rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.brand h1{font-size:1.3rem;margin:.15rem 0 .1rem}
.brand .sub{margin:0;font-size:.82rem;color:var(--ink-3)}
.toc ol{list-style:none;margin:0;padding:0}
.toc li{margin:0}
.toc a{display:flex;gap:.55rem;align-items:baseline;padding:.32rem .6rem;border-radius:7px;color:var(--ink-2);text-decoration:none;font-size:.93rem}
.toc a .num{font:600 .78rem/1 var(--mono);color:var(--ink-3);min-width:1.3rem;text-align:right}
.toc a:hover{background:var(--panel-2);color:var(--ink)}
.toc a[aria-current="page"]{background:var(--tint);color:var(--ink);font-weight:650;box-shadow:inset 3px 0 0 var(--accent)}
.toc a[aria-current="page"] .num{color:var(--accent)}
.card{border:1px solid var(--line);border-radius:10px;padding:.75rem .85rem;background:var(--bg)}
.inputs-card h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0 0 .4rem}
.inputs-card .vname{font:700 1.05rem var(--mono);color:var(--accent);margin:0 0 .35rem}
.inputs-card dl{margin:0 0 .6rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.15rem .6rem;font-size:.82rem}
.inputs-card dt{color:var(--ink-3)}
.inputs-card dd{margin:0;font-family:var(--mono);word-break:break-all;line-height:1.4}
.test-badge{margin:.6rem 0 0;font-size:.8rem}
.topbar{display:none}
main{padding:2rem clamp(1rem,4vw,3rem) 4rem;width:100%;max-width:1060px}
.banner{border-radius:10px;padding:.75rem 1rem;margin:0 0 1.5rem;font-weight:600}
.banner.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
@media (max-width:979.98px){
  :root{--topbar-h:56px}
  .app{display:block}
  .topbar{display:flex;position:sticky;top:0;z-index:30;gap:.6rem;align-items:center;min-height:var(--topbar-h);padding:.5rem 1rem;padding-top:calc(.5rem + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
  .topbar select{flex:1;min-width:0;font:inherit;font-size:.95rem;padding:.4rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .topbar .tb-variant{font:700 .85rem var(--mono);color:var(--accent);white-space:nowrap}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:.8rem 1rem}
  .side .brand,.side .toc{display:none}
  .inputs-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 .8rem;align-items:start;padding:.55rem .75rem}
  .inputs-card h2{display:none}
  .inputs-card .vname{grid-column:1;margin:0 0 .2rem;font-size:.95rem}
  .inputs-card dl{grid-column:1;margin:0;font-size:.78rem;gap:0 .5rem}
  .inputs-card #changeInputs{grid-column:2;grid-row:1 / span 2;font-size:.8rem;padding:.3rem .6rem;min-height:2rem}
  .inputs-card .test-badge{grid-column:2;grid-row:3;margin:.2rem 0 0;font-size:.72rem;text-align:right}
  .dbg-slider{flex-wrap:wrap}
  .dbg-slider input{order:3;flex-basis:100%}
  main{padding-top:1.4rem}
}

/* ---------- chapter chrome ---------- */
.ch-head{margin:0 0 1.4rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
.ch-num{margin:0 0 .25rem;font:600 .78rem var(--mono);color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.ch-head h2{font-size:clamp(1.55rem,3vw,2rem)}
.ch-head h2:focus{outline:none}
.gist{font-size:1.06rem;color:var(--ink-2);margin:.4rem 0 0;max-width:60ch}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line)}
.pager .btn{max-width:48%;text-align:left}
.pager .btn:last-child{text-align:right;margin-left:auto}
.pager .btn small{display:block;font-size:.72rem;color:var(--ink-3);font-weight:500}
.lede{font-size:1.02rem;max-width:72ch}
.prose{max-width:74ch}

/* ---------- controls ---------- */
.btn{font:inherit;font-size:.9rem;font-weight:550;line-height:1.3;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:.45rem .8rem;border-radius:8px;cursor:pointer;min-height:2.25rem}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{font-size:.8rem;padding:.25rem .55rem;min-height:1.8rem}
.btn-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.8rem 0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:650;font-size:.9rem;padding:0;margin-bottom:.35rem}
.field label,.lbl{display:block;font-weight:600;font-size:.85rem;margin-bottom:.25rem}
.field .hint{font-weight:400;color:var(--ink-3);font-size:.78rem;margin-left:.3rem;font-family:var(--mono)}
input[type="text"],select{font:.95rem var(--mono);width:100%;padding:.45rem .55rem;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);min-height:2.3rem}
select{font-family:var(--font)}
input[type="text"]:hover,select:hover{border-color:var(--ink-3)}
input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
input[type="range"]{accent-color:var(--accent);width:100%;min-width:0}
input[type="checkbox"],input[type="radio"]{accent-color:var(--accent)}
.err{color:var(--bad);font-size:.8rem;margin:.25rem 0 0;font-weight:550}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{padding:.42rem 1rem;cursor:pointer;font-weight:650;font-size:.9rem;margin:0}
.seg label+input+label{border-left:1px solid var(--line)}
.seg input:checked+label{background:var(--accent);color:var(--on-accent)}
.seg input:focus-visible+label{outline:3px solid var(--accent);outline-offset:-3px}
.seg .c-simon,.seg .c-speck{display:contents}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.9rem 1rem;margin:.9rem 0}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem .8rem}
.status{min-height:1.5em;font-size:.9rem;font-weight:550}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:1rem 0}
.callout{border-left:4px solid var(--accent);background:var(--tint);padding:.7rem 1rem;border-radius:0 10px 10px 0;margin:1rem 0}
.callout p:first-child{margin-top:0}.callout p:last-child{margin-bottom:0}

/* ---------- tables & details ---------- */
.tbl{overflow-x:auto;margin:.8rem 0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:.45rem .65rem;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:var(--panel-2);font-weight:650;font-size:.8rem;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody th{font-weight:650;background:var(--panel-2);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.hex{font-family:var(--mono);font-size:.82rem;white-space:nowrap}
tr.cur td{background:var(--tint)}
tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
tr.cur.click:hover td{background:var(--tint-2)}
.pass{color:var(--ok);font-weight:700}
.fail{color:var(--bad);font-weight:700}
details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:1rem 0}
summary{cursor:pointer;padding:.65rem .95rem;font-weight:650;list-style-position:inside}
summary:hover{color:var(--accent)}
details[open] summary{border-bottom:1px solid var(--line)}
details>.inner{padding:.2rem .95rem .9rem}
details .tbl{border:0;border-radius:0;margin:0 -.95rem;background:transparent}

/* ---------- code ---------- */
.code{position:relative;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:auto;margin:.8rem 0;font:12.8px/1.6 var(--mono)}
.code pre{margin:0;padding:.45rem 0;min-width:max-content;font:inherit}
.code .ln{display:block;white-space:pre;padding-right:1rem;min-height:1.6em}
.code .no{display:inline-block;width:3.3em;padding-right:.8em;margin-right:.9em;text-align:right;color:var(--ink-3);border-right:1px solid var(--line);user-select:none;-webkit-user-select:none}
.code .ln.on{background:var(--tint);box-shadow:inset 4px 0 0 var(--accent)}
.code .ln.on .no{color:var(--accent);font-weight:700}
.code .ln.skip .src{opacity:.5;text-decoration:line-through;text-decoration-color:var(--bad)}
.code .ln.gap .no{border-right-style:dashed}
.code mark{background:var(--tint-2);color:inherit;border-radius:3px;outline:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.tk-kw{color:var(--k-kw)} .tk-str{color:var(--k-str)} .tk-num{color:var(--k-num)} .tk-com{color:var(--k-com);font-style:italic}
.tk-fn{color:var(--k-fn)} .tk-bi{color:var(--k-bi)} .tk-const{color:var(--k-const)}
.code-tools{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
pre.out{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:.7rem 1rem;overflow-x:auto;font:12.8px/1.55 var(--mono);margin:.8rem 0}
pre.out.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
pre.out.good{border-color:var(--ok)}

/* ---------- bit strips ---------- */
.bits{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));column-gap:1px;height:18px;width:100%;max-width:calc(var(--cols) * 20px)}
.bits>i{display:block;background:var(--bit0);border-radius:2px;position:relative;min-width:0}
.bits>i.b1{background:var(--bit1)}
.bits>i.nb{margin-left:2px}
.bits>i.sp{background:transparent}
.bits>i.ov{background:repeating-linear-gradient(135deg,var(--bit0) 0 2px,transparent 2px 4px);outline:1px dashed var(--ink-3);outline-offset:-1px}
.bits>i.ov.b1{background:repeating-linear-gradient(135deg,var(--bit1) 0 2.5px,transparent 2.5px 4px)}
.bits>i.chg{box-shadow:0 0 0 2px var(--accent);z-index:1}
.bits>i.mk::after{content:"";position:absolute;left:10%;right:10%;bottom:-5px;height:3px;border-radius:2px;background:var(--accent)}
.bits>i.hit{box-shadow:0 0 0 2px var(--accent),0 0 0 4px var(--panel);z-index:2}
.bits.acc>i.b1{background:var(--accent)}
.bits.click>i[data-bit]{cursor:pointer}
.bits.click>i[data-bit]:hover{box-shadow:0 0 0 2px var(--ink-3)}
.bits.big{height:24px}
.ruler{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));column-gap:1px;width:100%;max-width:calc(var(--cols) * 20px);font:10px/1 var(--mono);color:var(--ink-3);height:12px}
.ruler>span{white-space:nowrap;overflow:visible;display:flex;justify-content:center;min-width:0}
.ruler>span.nb{margin-left:2px}
.vars{display:flex;flex-direction:column;gap:.2rem;margin:.7rem 0}
.vrow{display:grid;grid-template-columns:1.3rem minmax(8rem,14rem) minmax(0,1fr) minmax(5.5rem,auto);gap:.25rem .65rem;align-items:center;min-height:1.7rem}
.vrow .op{font:700 1rem/1 var(--mono);color:var(--ink-3);text-align:center}
.vrow .vn{font:.84rem/1.3 var(--mono);overflow-wrap:anywhere}
.vrow .vn .sub{display:block;color:var(--ink-3);font:.76rem/1.3 var(--font)}
.vrow .vh{font:.8rem var(--mono);color:var(--ink-2);text-align:right;white-space:nowrap}
.vrow.res{border-top:1.5px solid var(--ink-3);padding-top:.35rem;margin-top:.1rem}
.vrow.res .vn{font-weight:700}
.vrow.rul{min-height:1rem}
.vrow.sep{margin-top:.5rem}
.wide-scroll{overflow-x:auto;padding:.2rem .1rem .6rem}
.wide-scroll .vars{min-width:min(100%,640px)}
@media (max-width:640px){
  .vrow{grid-template-columns:1.1rem minmax(0,1fr) auto;grid-template-areas:"op vn vh" ". vb vb";row-gap:.15rem}
  .vrow .op{grid-area:op} .vrow .vn{grid-area:vn} .vrow .vb{grid-area:vb} .vrow .vh{grid-area:vh}
  .vrow.rul{grid-template-areas:". vb vb"}
  .vrow.rul .vn,.vrow.rul .vh{display:none}
  .dbg-bar{padding:.5rem .6rem;gap:.4rem .6rem}
  .dbg-btns .btn{padding:.35rem .6rem;min-height:2rem;font-size:.85rem}
  .pipe .arrow{display:none}
  .pipe .step-btn{flex-basis:140px}
  .tbl.stack{border-radius:10px}
  .tbl.stack table,.tbl.stack tbody,.tbl.stack tr,.tbl.stack td,.tbl.stack tbody th{display:block;width:100%}
  .tbl.stack thead{display:none}
  .tbl.stack tr{border-bottom:1px solid var(--line);padding:.45rem 0}
  .tbl.stack tbody tr:last-child{border-bottom:0}
  .tbl.stack td{border:0;padding:.15rem .75rem}
  .tbl.stack td[data-label]::before{content:attr(data-label);display:block;font:600 .7rem/1.5 var(--font);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
  .tbl.stack td:empty{display:none}
  .bits>i.nb,.ruler>span.nb{margin-left:1px}
}

/* ---------- debugger ---------- */
.dbg{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:1rem 0}
.dbg-bar{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.7rem .9rem;border-bottom:1px solid var(--line);position:sticky;top:var(--topbar-h);background:var(--panel);z-index:6;border-radius:12px 12px 0 0}
.dbg-slider{display:flex;align-items:center;gap:.6rem;flex:1 1 280px;min-width:0}
.dbg-slider .lbl{margin:0;white-space:nowrap}
.dbg-slider output{font:600 .85rem var(--mono);color:var(--accent);min-width:7.5rem;white-space:nowrap}
.dbg-btns{display:flex;gap:.4rem;flex-wrap:wrap}
.dbg-pos{font-size:.8rem;color:var(--ink-3);white-space:nowrap}
.dbg-code .code{margin:0;border:0;border-radius:0;border-bottom:1px solid var(--line);max-height:19rem}
.dbg-step{padding:.9rem 1rem 1rem}
.say{font-size:1.02rem;margin:0 0 .4rem;font-weight:500;max-width:80ch}
.lnref{font:700 .75rem var(--mono);background:var(--accent);color:var(--on-accent);padding:.12rem .45rem;border-radius:5px;margin-right:.5rem;vertical-align:.1em;white-space:nowrap}
.tag{display:inline-block;font:700 .7rem/1.5 var(--font);text-transform:uppercase;letter-spacing:.05em;padding:.05rem .45rem;border-radius:99px;border:1.5px solid var(--accent);color:var(--accent);margin-left:.4rem;vertical-align:.12em}
.note{font-size:.9rem;color:var(--ink-2);margin:.6rem 0 0;max-width:80ch}
.match{display:inline-flex;gap:.4rem;align-items:center;font-weight:650;color:var(--ok);background:var(--ok-bg);border-radius:8px;padding:.3rem .6rem;margin:.4rem 0;font-size:.9rem}
.match.no{color:var(--bad);background:var(--bad-bg)}

/* ---------- chapter-specific ---------- */
.fams{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1rem 0}
.fam{border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:.8rem 1rem;background:var(--panel)}
.fam h4{margin:0 0 .3rem;color:var(--accent);font-family:var(--mono);font-size:1.05rem}
.fam ul{margin:.3rem 0;padding-left:1.1rem;font-size:.9rem}
.pipe{display:flex;flex-wrap:wrap;align-items:stretch;gap:.35rem;margin:1rem 0}
.pipe .step-btn{flex:1 1 128px;min-width:0;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:.6rem .7rem;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:.2rem}
.pipe .step-btn:hover{border-color:var(--accent);background:var(--tint)}
.pipe .step-btn b{font-size:.92rem}
.pipe .step-btn b .sn{color:var(--accent);font-family:var(--mono);margin-right:.3rem}
.pipe .step-btn code{font-size:.72rem;color:var(--ink-2);overflow-wrap:anywhere;background:none;padding:0}
.pipe .step-btn .go{font-size:.72rem;color:var(--accent);font-weight:650;margin-top:auto}
.pipe .arrow{align-self:center;color:var(--ink-3);font-size:1.1rem}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.55rem 1.2rem;margin:.8rem 0;padding:0;list-style:none}
.legend li{display:flex;gap:.7rem;align-items:center;margin:0;font-size:.9rem}
.legend .sw{flex:0 0 auto;width:4.2rem;display:flex;justify-content:center}
.legend .sw .bits{width:4.2rem}

SIMON = {(16, 4): (32, 0), (24, 3): (36, 0), (24, 4): (36, 1), (32, 3): (42, 2), (32, 4): (44, 3),
         (48, 2): (52, 2), (48, 3): (54, 3), (64, 2): (68, 2), (64, 3): (69, 3), (64, 4): (72, 4)}
SPECK = {(16, 4): 22, (24, 3): 22, (24, 4): 23, (32, 3): 26, (32, 4): 27,

def rol(v, r, n): return ((v << r) | (v >> (n - r))) & ((1 << n) - 1)
def ror(v, r, n): return ((v >> r) | (v << (n - r))) & ((1 << n) - 1)

def _check(words, n, table, *block):
    """Reject unsupported variants and values that don't fit in an n-bit word."""
    if (n, len(words)) not in table:
        raise ValueError(f"unsupported variant: {n}-bit words with {len(words)} key words")
    for v in (*words, *block):

    """key = [k0, k1, ..., k_{m-1}]  (k0 is the RIGHTMOST word in the paper's test vectors)"""
    _check(key, n, SIMON)
    m = len(key); T, j = SIMON[(n, m)]; mask = (1 << n) - 1
    k = list(key)
    for i in range(m, T):
        tmp = ror(k[i - 1], 3, n)
        if m == 4:
            tmp ^= k[i - 3]
        tmp ^= ror(tmp, 1, n)
        k.append((~k[i - m] & mask) ^ tmp ^ int(Z[j][(i - m) % 62]) ^ 3)

    _check(key, n, SIMON, x, y)
    for k in simon_round_keys(key, n):

    return x, y

    _check(key, n, SIMON, x, y)
    for k in reversed(simon_round_keys(key, n)):

    return x, y

    m = len(key); T = SPECK[(n, m)]; mask = (1 << n) - 1

"use strict";
// Instrumented copies of the loops in ref.py. They do the same arithmetic but also record every
// intermediate value the page draws. checkTracers() confirms they agree with the plain functions.

const MASK = n => (1n << BigInt(n)) - 1n;
const speckAB = n => (n === 16 ? [7, 2] : [8, 3]);

// simon_round_keys, lines 28-33
function traceSimonKeys(key, n) {
  const m = key.length, [T, j] = SIMON.get(`${n},${m}`), mask = MASK(n);
  const k = [...key], iters = [];
  for (let i = m; i < T; i++) {
    const it = { i, km1: k[i - 1], kim: k[i - m] };
    let tmp = ror(k[i - 1], 3, n);                       // 29
    it.tmp29 = tmp;

    it.pre32 = tmp; it.ror1 = ror(tmp, 1, n);
    tmp ^= it.ror1;                                      // 32
    it.tmp32 = tmp;
    it.notk = ~k[i - m] & mask;                          // 33, term by term
    it.zidx = (i - m) % 62;
    it.zbit = BigInt(Z[j][it.zidx]);

    k.push(it.out);
    iters.push(it);
  }

}

// speck_round_keys, lines 56-58
function traceSpeckKeys(key, n) {
  const m = key.length, T = SPECK.get(`${n},${m}`), mask = MASK(n), [a, b] = speckAB(n);

    it.rorl = ror(l[i], a, n);                           // 57, piece by piece
    it.sum = k[i] + it.rorl;
    it.carries = it.sum ^ k[i] ^ it.rorl;                // bit p = carry into bit p
    it.masked = it.sum & mask;

    it.knew = it.rolk ^ l[i + m - 1];

function traceSimonEnc(x, y, rk, n) {
  return rk.map((k, idx) => {

// simon_decrypt, lines 46-47
function traceSimonDec(x, y, rk, n) {
  const T = rk.length;
  return [...rk].reverse().map((k, idx) => {
    const s = { s: idx + 1, kidx: T - 1 - idx, k, x, y };
    s.s1 = rol(y, 1, n); s.s8 = rol(y, 8, n); s.and = s.s1 & s.s8; s.s2 = rol(y, 2, n);

// speck_decrypt, lines 72-74

    const s = { s: idx + 1, kidx: T - 1 - idx, k, x, y };

    s.xk = x ^ k; s.diff = s.xk - y;                                   // 74, piece by piece

  });

function checkTracers() {
  const bad = [];

      const key = keyText.trim().split(/\s+/).map(w => BigInt("0x" + w)).reverse();
      const [x, y] = pt.trim().split(/\s+/).map(w => BigInt("0x" + w));

      if (!ok) bad.push(`${cipher.toUpperCase()}${2 * n}/${n * key.length}`);
    }

}

let version = 0;       // bumps on every change, so chapters know to re-render

const splitHex = t => t.trim().split(/\s+/).map(w => BigInt("0x" + w));
const vectorFor = (cipher, n, m) => VECTORS[cipher].find(v => v[0] === n && v[1].trim().split(/\s+/).length === m);
function vectorState(cipher, n, m) {
  const [, keyText, pt] = vectorFor(cipher, n, m);
  const [x, y] = splitHex(pt);
  return { cipher, n, m, key: splitHex(keyText).reverse(), x, y };
}
const paperKey = (key = S.key, n = S.n) => [...key].reverse().map(w => hexw(w, n)).join(" ");

function derive() {
  const { cipher, n, m, key, x, y } = S, simon = cipher === "simon";
  D = { name: vname(cipher, n, m), mask: MASK(n) };
  if (simon) [D.T, D.j] = SIMON.get(`${n},${m}`);
  else { D.T = SPECK.get(`${n},${m}`); [D.a, D.b] = speckAB(n); }
  D.ks = (simon ? traceSimonKeys : traceSpeckKeys)(key, n);
  D.rk = (simon ? simon_round_keys : speck_round_keys)(key, n);          // the reference function itself
  D.rounds = (simon ? traceSimonEnc : traceSpeckEnc)(x, y, D.rk, n);
  [D.cx, D.cy] = (simon ? simon_encrypt : speck_encrypt)(x, y, key, n);
  D.dec = (simon ? traceSimonDec : traceSpeckDec)(D.cx, D.cy, D.rk, n);
  [D.px, D.py] = (simon ? simon_decrypt : speck_decrypt)(D.cx, D.cy, key, n);
  D.states = [[x, y], ...D.rounds.map(r => [r.nx, r.ny])];             // D.states[r] = state after round r
  const v = vectorFor(cipher, n, m), ref = vectorState(cipher, n, m);
  D.vec = v;
  D.isPaper = ref.x === x && ref.y === y && ref.key.every((w, i) => w === key[i]);
  D.paperCt = splitHex(v[3]);
}

function setState(next) {
  Object.assign(S, next);
  derive();
  version++;
  refreshChrome();
  if (cur >= 0) renderChapter(CH[cur], true);
}

function renderChapter(ch, keepFocus) {
  const fid = keepFocus && document.activeElement && ch.sec.contains(document.activeElement) ? document.activeElement.id : null;

  if (fid && document.getElementById(fid)) document.getElementById(fid).focus({ preventScroll: true });
}

function go(target, { focus = true, push = true } = {}) {
  const idx = typeof target === "number" ? target : CH.findIndex(ch => ch.id === target);
  if (idx < 0) return;
  steppers.forEach(s => s.stop());
  if (idx !== cur) {
    if (cur >= 0) CH[cur].sec.hidden = true;
    cur = idx;
    CH[idx].sec.hidden = false;
  }
  const ch = CH[idx];
  if (ch.v !== version) renderChapter(ch);
  else if (ch.redraw) ch.redraw();       // canvases size themselves to the visible width
  $$("#toc a").forEach((a, i) => (i === idx ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  $("#chSelect").value = ch.id;
  const prev = CH[idx - 1], next = CH[idx + 1], pb = $("#prevBtn"), nb = $("#nextBtn");
  pb.hidden = !prev; nb.hidden = !next;
  if (prev) pb.innerHTML = `<small>Previous</small>← ${idx}. ${esc(prev.title)}`;
  if (next) nb.innerHTML = `<small>Next</small>${idx + 2}. ${esc(next.title)} →`;
  document.title = `${idx + 1}. ${ch.title} · ref.py explained`;
  if (push && location.hash !== "#" + ch.id) history.pushState(null, "", "#" + ch.id);
  if (focus) { window.scrollTo(0, 0); ch.h2.focus({ preventScroll: true }); }
}

function readWord(inp, n) {
    const t = inp.value.trim().replace(/^0x/i, '').replace(/[\s_]/g, '')
    let err = null,
        v = null
    if (!t)
        err =
            'Enter a value in hex, for example ' +
            '1a2b3c4d5e6f7081'.slice(0, n / 4) +
            '.'
    else if (!/^[0-9a-f]+$/i.test(t)) err = 'Use hex digits only: 0–9 and a–f.'
    else {
        v = BigInt('0x' + t)
        if (v >> BigInt(n))
            err = `Too big for a ${n}-bit word. Use at most ${n / 4} hex digits; the largest allowed value is ${'f'.repeat(n / 4)}.`
    }
    showErr(inp, err)
    return err ? null : v
}
function randomWord(n) {
    const b = new Uint8Array(n / 8)
    crypto.getRandomValues(b)
    return b.reduce((acc, x) => (acc << 8n) | BigInt(x), 0n)
}

const checkUI = { demo: 'pass', custom: '' }

function checkScenario() {
    const { cipher, n, m, key, x, y } = S,
        table = cipher === 'simon' ? SIMON : SPECK
    let words = key,
        block = [x, y],
        title = 'Your inputs',
        what = ''
    if (checkUI.demo === 'count') {
        const mm = [m - 1, m + 1, 1, 5].find(
            (k) => k >= 1 && !table.has(`${n},${k}`),
        )
        words = mm < m ? key.slice(0, mm) : [...key, ...Array(mm - m).fill(0n)]
        title = 'Wrong number of key words'
        what =
            mm < m
                ? `the key loses its last ${plural(m - mm, 'word')}, leaving ${mm}`
                : `${plural(mm - m, 'zero word')} ${mm - m === 1 ? 'is' : 'are'} added, making ${mm}`
    } else if (checkUI.demo === 'big') {
        block = [1n << BigInt(n), y]
        title = 'Oversized word'
        what = `x is replaced by 2<sup>${n}</sup> = ${hx(1n << BigInt(n), n)}, one more than the largest ${n}-bit value`
    } else if (checkUI.demo === 'custom') {
        block = [checkUI.customV, y]
        title = 'Your own value for x'
        what = `x is replaced by ${esc(pyHex(checkUI.customV))}`
    }
    let error = null
    try {
        _check(words, n, table, ...block)
    } catch (e) {
        error = e
    }
    return {
        words,
        block,
        title,
        what,
        error,
        table,
        tname: cipher === 'simon' ? 'SIMON' : 'SPECK',
    }
}

function checkIters(sc) {
    const { n, cipher } = S,
        { words, block, tname, table } = sc,
        steps = []
    const caller = cipher === 'simon' ? 39 : 62,
        fn = cipher + '_encrypt'
    const all = [...words, ...block],
        labels = [...words.map((_, i) => `key[${i}]`), 'x', 'y']
    const listTxt = `[${words.map((v) => hx(v, n)).join(', ')}]`
    const lim = 1n << BigInt(n)
    steps.push({
        line: 15,
        say: `Line ${caller} of ${C(fn)} calls ${C('_check')} with words = ${C(listTxt)}, n = ${n}, table = ${C(tname)} and *block = (${block.map((v) => esc(pyHex(v))).join(', ')}). The <code>*</code> gathers the extra arguments x and y into the tuple <code>block</code>.`,
    })
    steps.push({
        line: 16,
        say: `The docstring states the job: reject unsupported variants and values that don't fit in an n-bit word.`,
    })
    const inTable = table.has(`${n},${words.length}`)
    steps.push({
        line: 17,
        say: `len(words) = ${words.length}, so the test is whether (${n}, ${words.length}) is a key of ${C(tname)}. ${inTable ? 'It is, so the condition is false and line 18 is skipped.' : 'It is not, so the condition is true.'}`,
        body: `<div class="tbl"><table><thead><tr><th>(n, m) pairs in ${tname} with n = ${n}</th><th>matches (${n}, ${words.length})?</th></tr></thead><tbody>${VARIANTS.filter(
            ([nn]) => nn === n,
        )
            .map(
                ([nn, mm]) =>
                    `<tr${mm === words.length ? ' class="cur"' : ''}><td class="mono">(${nn}, ${mm})</td><td>${mm === words.length ? '<span class="pass">yes</span>' : 'no'}</td></tr>`,
            )
            .join('')}</tbody></table></div>`,
    })
    if (!inTable) {
        steps.push({
            line: 18,
            say: `Line 18 raises ${C('ValueError')}. Lines 19–21 never run.`,
            skip: [19, 20, 21],
            body: traceback(sc, 18),
        })
        return [{ label: sc.title, steps }]
    }
    steps.push({
        line: 18,
        skip: [18],
        say: `Line 18 is skipped because the variant exists.`,
    })
    steps.push({
        line: 19,
        say: `The loop will look at ${plural(all.length, 'value')}: the ${words.length} key words, then the ${block.length} words of *block.`,
        skip: [18],
    })
    const table2 = (upto) =>
        `<div class="tbl"><table><thead><tr><th>v</th><th>value</th><th>0 ≤ v</th><th>v &lt; 2<sup>${n}</sup></th><th>result</th></tr></thead><tbody>${all
            .map((v, i) => {
                const done = i <= upto,
                    ok = 0n <= v && v < lim
                return `<tr${i === upto ? ' class="cur"' : ''}><td class="mono">${labels[i]}</td><td class="hex">${esc(pyHex(v))}</td><td>${done ? (0n <= v ? 'yes' : '<span class="fail">no</span>') : ''}</td><td>${done ? (v < lim ? 'yes' : '<span class="fail">no</span>') : ''}</td><td>${done ? (ok ? '<span class="pass">fits</span>' : '<span class="fail">does not fit</span>') : '<span class="muted">not checked yet</span>'}</td></tr>`
            })
            .join('')}</tbody></table></div>`
    for (let i = 0; i < all.length; i++) {
        const v = all[i],
            ok = 0n <= v && v < lim
        const over = v >= lim ? v.toString(2).length - n : 0
        const strip =
            v >= 0n
                ? vars(
                      row(labels[i], v, n, {
                          over,
                          sub: ok
                              ? `fits in ${n} bits`
                              : `needs ${v.toString(2).length} bits`,
                      }),
                  )
                : ''
        steps.push({
            line: 20,
            skip: [18],
            say: `v = ${labels[i]} = ${esc(pyHex(v))}. Is 0 ≤ v &lt; 2<sup>${n}</sup> (${hx(lim, n + 1)})? ${ok ? 'Yes, so the loop moves on.' : v < 0n ? 'No: it is negative.' : 'No: it needs more than ' + n + ' bits.'}`,
            body: strip + table2(i),
        })
        if (!ok) {
            steps.push({
                line: 21,
                skip: [18],
                say: `Line 21 raises ${C('ValueError')} and the loop stops early.`,
                body: traceback(sc, 21),
            })
            return [{ label: sc.title, steps }]
        }
    }
    steps.push({
        line: 19,
        skip: [18, 21],
        say: `The loop has checked every value without raising, so ${C('_check')} returns ${C('None')} and line ${caller} carries on to encrypt.`,
        body: `<pre class="out good">_check(...) returned None: the inputs are accepted.</pre>`,
    })
    return [{ label: sc.title, steps }]
}

function traceback(sc, line) {
    const caller = S.cipher === 'simon' ? 39 : 62
    return `<pre class="out bad">Traceback (most recent call last):
  File "ref.py", line ${caller}, in ${S.cipher}_encrypt
    ${esc(LINES[caller - 1].trim())}
  File "ref.py", line ${line}, in _check
    ${esc(LINES[line - 1].trim())}
${esc(sc.error.name)}: ${esc(sc.error.message)}</pre>`
}

  <ol class="prose"><li>Line 17: does the table list this (n, m) pair? Otherwise line 18 raises.</li><li>Lines 19–20: does every key word, and x and y, fit in n bits? Otherwise line 21 raises.</li></ol>
  <div class="btn-row" role="group" aria-label="Choose what to check">

  <div id="checkDbg"></div>
  <p class="prose">The error messages above come from running the page's translation of ${C('_check')}. They match Python's output character for character, including Python's ${C('{v:#x}')} format, which writes negative numbers as <code>-0x5</code>.</p>`
    const checkStepper = new Stepper($('#checkDbg', el), {

    if (sc.error) checkStepper.go(0, iters[0].steps.length - 1) // jump straight to the raising line

    el.querySelectorAll('[data-demo]').forEach((b) =>
        b.addEventListener('click', () => {
            checkUI.demo = b.dataset.demo

            $(`[data-demo="${checkUI.demo}"]`, el)?.focus()
        }),
    )
    $('#customForm', el).addEventListener('submit', (e) => {
        e.preventDefault()
        const inp = $('#customX', el),

        const t = raw

        if (!/^[0-9a-f]+$/i.test(t)) {

        }
        checkUI.custom = raw
        checkUI.customV = (neg ? -1n : 1n) * BigInt('0x' + t)
        checkUI.demo = 'custom'

const rotUI = { fn: 'rol', r: 3, src: 'x' }

function rotationBody() {
    const n = S.n,
        { fn, src } = rotUI,
        r = clamp(rotUI.r, 1, n - 1),
        R = BigInt(r),
        N = BigInt(n)
    const v = src === 'x' ? S.x : src === 'y' ? S.y : S.key[0],
        mask = D.mask
    const left = fn === 'rol'
    const a = left ? v << R : v >> R,
        b = left ? v >> (N - R) : v << (N - R),
        or = a | b,
        res = or & mask
    const expect = (left ? rol : ror)(v, r, n)
    const cols = left ? n + r : 2 * n - r
    const wrapped = left ? (1n << R) - 1n : ((1n << R) - 1n) << (N - R)
    const srcName = src === 'key0' ? 'key[0]' : src
    const rows = left
        ? [
              row('v', v, n, { cols, sub: `${srcName}` }),
              row('v << r', a, n, {
                  cols,
                  over: r,
                  sub: `shift left by ${r}; ${r} zeros enter on the right`,
              }),
              row('v >> (n - r)', b, n, {
                  cols,
                  op: '|',
                  sub: `shift right by n − r = ${n - r}; the top ${r} bits land at the bottom`,
              }),
              row('(v << r) | (v >> (n - r))', or, n, {
                  cols,
                  over: r,
                  res: true,
                  sub: `${r} hatched bits stick out past bit ${n - 1}`,
              }),
              row('(1 << n) - 1', mask, n, { cols, op: '&', sub: 'mask' }),
              row(`rol(v, ${r}, ${n})`, res, n, {
                  cols,
                  res: true,
                  mark: wrapped,
                  sub: `underlined: the ${plural(r, 'bit')} that wrapped around`,
              }),
          ]
        : [
              row('v', v, n, { cols, sub: `${srcName}` }),
              row('v >> r', a, n, {
                  cols,
                  sub: `shift right by ${r}; the low ${plural(r, 'bit')} fall off`,
              }),
              row('v << (n - r)', b, n, {
                  cols,
                  over: n - r,
                  op: '|',
                  sub: `shift left by n − r = ${n - r}; the low ${r} bits move to the top of the word`,
              }),
              row('(v >> r) | (v << (n - r))', or, n, {
                  cols,
                  over: n - r,
                  res: true,
                  sub: `${n - r} hatched bits stick out past bit ${n - 1}`,
              }),
              row('(1 << n) - 1', mask, n, { cols, op: '&', sub: 'mask' }),
              row(`ror(v, ${r}, ${n})`, res, n, {
                  cols,
                  res: true,
                  mark: wrapped,
                  sub: `underlined: the ${plural(r, 'bit')} that wrapped around`,
              }),
          ]
    const inv = (left ? ror : rol)(res, r, n)
    return `<p class="say"><span class="lnref">line ${left ? 12 : 13}</span>${C(`${fn}(${hx(v, n)}, ${r}, ${n})`)} moves every bit ${r} ${r === 1 ? 'place' : 'places'} to the ${left ? 'left' : 'right'}; the ${plural(r, 'bit')} pushed off the ${left ? 'top' : 'bottom'} come back in at the ${left ? 'bottom' : 'top'}.</p>
    <div class="wide-scroll">${vars(ruler(n, cols), ...rows)}</div>
    <p class="note">${res === expect ? "✓ Same as calling the page's translation of " + C(fn) + '.' : '✗ Mismatch with ' + C(fn) + '.'} Rotating back with ${C(`${left ? 'ror' : 'rol'}(…, ${r}, ${n})`)} gives ${hx(inv, n)}${inv === v ? ', the original v: a rotation loses nothing.' : '.'}</p>`
}

function renderRotations(el) {
    const n = S.n
    rotUI.r = clamp(rotUI.r, 1, n - 1)
    const places = [
        [29, 'ror(k[i - 1], 3, n)', 'ror', '3', 'SIMON key schedule'],
        [32, 'ror(tmp, 1, n)', 'ror', '1', 'SIMON key schedule'],

// ======================================================================================
// Chapter 5 · Round keys
// ======================================================================================
const ksPos = { it: 1, st: 0 }
const lowBits = (r) => (1n << BigInt(r)) - 1n
const highBits = (r, n) => lowBits(r) << BigInt(n - r)
const keyRows = (n, cipher) =>
    S.key.map((v, i) =>
        row(`key[${i}]`, v, n, { sub: `${paperName(cipher, i)} in the paper` }),
    )

function simonKeyIters() {
    const n = S.n,
        t = D.ks,
        { m, T, j, mask } = t,
        c = (1n << BigInt(n)) - 4n
    const list = `[${S.key.map((v) => hx(v, n)).join(', ')}]`
    const iters = [
        {
            label: 'setup',
            steps: [
                {
                    line: 23,
                    say: `${C('simon_round_keys')} is called with key = ${C(list)} and n = ${n}.`,
                    body: vars(ruler(n), ...keyRows(n, 'simon')),
                },
                {
                    line: 24,
                    say: `The docstring fixes the word order: key[0] is k<sub>0</sub>, the rightmost word of the key as the paper prints it.`,
                },
                {
                    line: 25,
                    say: `${C('_check')} confirms that (${n}, ${m}) is a SIMON variant and that every key word fits in ${n} bits (see chapter 3).`,
                },
                {
                    line: 26,
                    say: `m = len(key) = ${m}. SIMON[(${n}, ${m})] = (${T}, ${j}), so T = ${T} rounds and the constant sequence is Z[${j}]. mask = 2<sup>${n}</sup> − 1 = ${hx(mask, n)}.`,
                },
                {
                    line: 27,
                    say: `k starts as a copy of the key, so the first m = ${m} round keys, k[0] to k[${m - 1}], are the key words themselves. The loop computes the other ${T - m}.`,
                    body: vars(
                        ruler(n),
                        ...S.key.map((v, i) =>
                            row(`k[${i}]`, v, n, { sub: `= key[${i}]` }),
                        ),
                    ),
                },
            ],
        },
    ]
    for (const it of t.iters) {
        const i = it.i,
            skip = m === 4 ? [] : [31]
        const zRow = row(`Z[${j}]`, BigInt('0b' + Z[j]), 62, {
            hit: 61 - it.zidx,
            hex: `index ${it.zidx}`,
            sub: `the 62-bit sequence, read left to right; the ringed bit is index ${it.zidx}`,
        })
        const tmpSoFar = vars(
            row('tmp after line 29', it.tmp29, n),
            row(
                m === 4 ? 'tmp after line 31' : 'tmp after line 31 (skipped)',
                m === 4 ? it.tmp31 : it.tmp29,
                n,
            ),
            row('tmp after line 32', it.tmp32, n),
        )
        const steps = [
            {
                line: 28,
                say: `Iteration i = ${i} builds round key k[${i}]. It reads k[i-1] = k[${i - 1}]${m === 4 ? `, k[i-3] = k[${i - 3}]` : ''} and k[i-m] = k[${i - m}].`,
                body: vars(
                    ruler(n),
                    row(`k[i-1] = k[${i - 1}]`, it.km1, n, {
                        sub: 'the previous round key',
                    }),
                    ...(m === 4
                        ? [row(`k[i-3] = k[${i - 3}]`, it.km3, n)]
                        : []),
                    row(`k[i-m] = k[${i - m}]`, it.kim, n, {
                        sub: `the key from m = ${m} places back`,
                    }),
                ),
            },
            {
                line: 29,
                say: `tmp = ror(k[i-1], 3, n) rotates k[i-1] = k[${i - 1}] right by 3 bits.`,
                body: vars(
                    ruler(n),
                    row(`k[i-1] = k[${i - 1}]`, it.km1, n),
                    row('tmp', it.tmp29, n, {
                        res: true,
                        mark: highBits(3, n),
                        sub: 'after line 29; underlined bits wrapped round',
                    }),
                ),
            },
            {
                line: 30,
                say:
                    m === 4
                        ? `m is 4, so the test m == 4 is true and line 31 runs.`
                        : `m is ${m}, so the test m == 4 is false and line 31 will be skipped.`,
            },
            m === 4
                ? {
                      line: 31,
                      say: `tmp ^= k[i-3] XORs in k[i-3] = k[${i - 3}]. Only 4-word keys do this; it lets the extra key word feed into the schedule.`,
                      body: vars(
                          ruler(n),
                          row('tmp', it.tmp29, n, { sub: 'after line 29' }),
                          row(`k[i-3] = k[${i - 3}]`, it.km3, n, { op: '^' }),
                          row('tmp', it.tmp31, n, {
                              res: true,
                              diff: it.tmp29 ^ it.tmp31,
                              sub: 'after line 31; outlined bits changed',
                          }),
                      ),
                  }
                : {
                      line: 31,
                      skip,
                      say: `Line 31 is skipped. It only runs for 4-word keys, and this key has m = ${m} words, so tmp keeps its value from line 29.`,
                      body: vars(
                          ruler(n),
                          row('tmp', it.tmp29, n, {
                              sub: 'unchanged since line 29',
                          }),
                      ),
                  },
            {
                line: 32,
                skip,
                say: `tmp ^= ror(tmp, 1, n) XORs tmp with a copy of itself rotated right by one more bit.`,
                body:
                    vars(
                        ruler(n),
                        row('tmp', it.pre32, n, {
                            sub: m === 4 ? 'after line 31' : 'after line 29',
                        }),
                        row('ror(tmp, 1, n)', it.ror1, n, { op: '^' }),
                        row('tmp', it.tmp32, n, {
                            res: true,
                            diff: it.pre32 ^ it.tmp32,
                            sub: 'after line 32; outlined bits changed',
                        }),
                    ) +
                    `<h4>tmp after each line</h4>` +
                    tmpSoFar,
            },
            {
                line: 33,
                skip,
                say: `Line 33 XORs four terms to make the new round key k[${i}]: k[i-m] = k[${i - m}] with every bit flipped, tmp, bit ${it.zidx} of Z[${j}], and the constant 3.`,
                body:
                    vars(
                        ruler(n),
                        row(`k[i-m] = k[${i - m}]`, it.kim, n, {
                            sub: 'before flipping',
                        }),
                        row('~k[i-m] & mask', it.notk, n, {
                            sep: true,
                            sub: '~ flips every bit; & mask keeps n of them',
                        }),
                        row('tmp', it.tmp32, n, { op: '^' }),
                        row(`int(Z[${j}][${it.zidx}])`, it.zbit, n, {
                            op: '^',
                            sub: `(i-m) % 62 = (${i}-${m}) % 62 = ${it.zidx}`,
                        }),
                        row('3', 3n, n, { op: '^' }),
                        row(`k[${i}]`, it.out, n, {
                            res: true,
                            sub: 'appended to k',
                        }),
                    ) +
                    `<h4>Where the Z bit comes from</h4>` +
                    `<div class="wide-scroll">${vars(zRow)}</div>`,
            },
            {
                line: 33,
                skip,
                say: `Why the ~ and the 3? (~k[i-m] &amp; mask) ^ 3 is the same as k[i-m] ^ c, where c = 2<sup>n</sup> − 4 = ${hx(c, n)} is the constant written in the paper.`,
                body:
                    vars(
                        ruler(n),
                        row('~k[i-m] & mask', it.notk, n),
                        row('3', 3n, n, { op: '^' }),
                        row('(~k[i-m] & mask) ^ 3', it.notk ^ 3n, n, {
                            res: true,
                        }),
                        row(`k[i-m] = k[${i - m}]`, it.kim, n, { sep: true }),
                        row('c = 2**n - 4', c, n, { op: '^' }),
                        row('k[i-m] ^ c', it.kim ^ c, n, { res: true }),
                    ) +
                    `<p class="${(it.notk ^ 3n) === (it.kim ^ c) ? 'match' : 'match no'}">${(it.notk ^ 3n) === (it.kim ^ c) ? '✓ The two results are equal.' : '✗ The results differ.'}</p>` +
                    `<p class="note">Flipping every bit with ${C('~v & mask')} is the same as ${C('v ^ mask')}. XOR with 3 flips the lowest two bits back again. Together that is v ^ (mask ^ 3), and mask ^ 3 = 2<sup>n</sup> − 1 − 3 = 2<sup>n</sup> − 4 = c. The paper writes the key schedule as k<sub>i</sub> = c ⊕ (z<sub>j</sub>)<sub>i−m</sub> ⊕ k<sub>i−m</sub> ⊕ (I ⊕ S<sup>−1</sup>)(…); the code writes the same thing with ~ and 3.</p>`,
            },
        ]
        iters.push({ label: `i = ${i} → k[${i}]`, steps })
    }
    iters.push({
        label: 'return',
        steps: [
            {
                line: 34,
                say: `The loop has filled k[0] to k[${T - 1}], so the function returns all T = ${T} round keys. The full list is in the table below.`,
                body: vars(
                    ruler(n),
                    row('k[0]', D.rk[0], n, { sub: 'first' }),
                    row(`k[${T - 1}]`, D.rk[T - 1], n, { sub: 'last' }),
                ),
            },
        ],
    })
    return iters
}

function speckKeyIters() {
    const n = S.n,
        t = D.ks,
        { m, T, a, b, mask } = t
    const list = `[${S.key.map((v) => hx(v, n)).join(', ')}]`
    const iters = [
        {
            label: 'setup',
            steps: [
                {
                    line: 50,
                    say: `${C('speck_round_keys')} is called with key = ${C(list)} and n = ${n}.`,
                    body: vars(ruler(n), ...keyRows(n, 'speck')),
                },
                {
                    line: 51,
                    say: `The docstring fixes the word order: key[0] is k<sub>0</sub> and the rest are ℓ<sub>0</sub>, ℓ<sub>1</sub>, …, with k<sub>0</sub> rightmost in the paper's printout.`,
                },
                {
                    line: 52,
                    say: `${C('_check')} confirms that (${n}, ${m}) is a SPECK variant and that every key word fits in ${n} bits (see chapter 3).`,
                },
                {
                    line: 53,
                    say: `m = len(key) = ${m}. SPECK[(${n}, ${m})] = ${T}, so T = ${T} rounds. mask = 2<sup>${n}</sup> − 1 = ${hx(mask, n)}.`,
                },
                {
                    line: 54,
                    say: `n is ${n}, so the rotation amounts are a = ${a} and b = ${b}${n === 16 ? ' (the 32-bit block uses smaller rotations)' : ''}.`,
                },
                {
                    line: 55,
                    say: `k = [key[0]] holds the first round key. l = key[1:] holds the other ${plural(m - 1, 'key word')}, which never become round keys themselves: they only feed the schedule.`,
                    body: vars(
                        ruler(n),
                        row('k[0]', S.key[0], n, { sub: '= key[0] = k0' }),
                        ...S.key
                            .slice(1)
                            .map((v, i) =>
                                row(`l[${i}]`, v, n, {
                                    sub: `= key[${i + 1}] = ℓ${sub(i)}`,
                                }),
                            ),
                    ),
                },
            ],
        },
    ]
    for (const it of t.iters) {
        const i = it.i,
            li = i + m - 1,
            cols = n + 1
        iters.push({
            label: `i = ${i} → k[${i + 1}]`,
            steps: [
                {
                    line: 56,
                    say: `Iteration i = ${i} makes l[i+m-1] = l[${li}] and k[i+1] = k[${i + 1}]. Lines 57–58 are SPECK's own round function, with the counter i in place of a round key.`,
                    body: vars(
                        ruler(n),
                        row(`k[i] = k[${i}]`, it.ki, n),
                        row(`l[i] = l[${i}]`, it.li, n),
                    ),
                },
                {
                    line: 57,
                    say: `First, ror(l[i], a, n) rotates l[i] = l[${i}] right by a = ${a}.`,
                    body: vars(
                        ruler(n),
                        row(`l[i] = l[${i}]`, it.li, n),
                        row('ror(l[i], a, n)', it.rorl, n, {
                            res: true,
                            mark: highBits(a, n),
                            sub: 'underlined bits wrapped round',
                        }),
                    ),
                },
                {
                    line: 57,
                    say: `Then k[i] = k[${i}] is added to it. The sum can need ${n + 1} bits, so & mask drops the carry out of the top. ${NONLIN}`,
                    body: vars(
                        ruler(n, cols),
                        row(`k[i] = k[${i}]`, it.ki, n, { cols }),
                        row('ror(l[i], a, n)', it.rorl, n, { cols, op: '+' }),
                        row('carries', it.carries, n, {
                            cols,
                            over: 1,
                            acc: true,
                            sub: 'a coloured cell is a carry into that bit',
                        }),
                        row('k[i] + ror(l[i], a, n)', it.sum, n, {
                            cols,
                            over: 1,
                            res: true,
                            sub:
                                it.sum >> BigInt(n)
                                    ? 'the hatched top bit is the carry out'
                                    : 'no carry out of the top this time',
                        }),
                        row('(…) & mask', it.masked, n, { cols, res: true }),
                    ),
                },
                {
                    line: 57,
                    say: `^ i XORs in the counter i = ${i}, and l.append stores the result as l[${li}].`,
                    body: vars(
                        ruler(n),
                        row('(k[i] + ror(l[i], a, n)) & mask', it.masked, n),
                        row('i', BigInt(i), n, { op: '^' }),
                        row(`l[${li}]`, it.lnew, n, {
                            res: true,
                            diff: it.masked ^ it.lnew,
                            sub: 'appended to l',
                        }),
                    ),
                },
                {
                    line: 58,
                    say: `rol(k[i], b, n) rotates k[i] = k[${i}] left by b = ${b}, and XOR with the word just made, l[i+m-1] = l[${li}], gives the next round key k[${i + 1}].`,
                    body: vars(
                        ruler(n),
                        row(`k[i] = k[${i}]`, it.ki, n),
                        row('rol(k[i], b, n)', it.rolk, n, {
                            mark: lowBits(b),
                            sub: 'underlined bits wrapped round',
                        }),
                        row(`l[i+m-1] = l[${li}]`, it.lnew, n, { op: '^' }),
                        row(`k[${i + 1}]`, it.knew, n, {
                            res: true,
                            sub: 'appended to k',
                        }),
                    ),
                },
            ],
        })
    }
    iters.push({
        label: 'return',
        steps: [
            {
                line: 59,
                say: `The loop ran T − 1 = ${T - 1} times, adding one key each time to k[0], so the function returns T = ${T} round keys. The l list is thrown away.`,
                body: vars(
                    ruler(n),
                    row('k[0]', D.rk[0], n, { sub: 'first' }),
                    row(`k[${T - 1}]`, D.rk[T - 1], n, { sub: 'last' }),
                ),
            },
        ],
    })
    return iters
}

function renderRoundKeys(el) {
    const { n, cipher } = S,
        simon = cipher === 'simon',
        m = S.m,
        T = D.T
    const rkRows = D.rk
        .map((v, i) => {
            const fromKey = simon ? i < m : i === 0
            const src = fromKey
                ? `key[${i}] = ${paperName(cipher, i)}, straight from the key`
                : simon
                  ? `line 33, iteration i = ${i}`
                  : `line 58, iteration i = ${i - 1}`
            return `<tr${fromKey ? ' class="cur"' : ''}><td class="num">${i}</td><td class="hex">${hexw(v, n)}</td><td>${src}${fromKey ? ' <span class="tag">from the key</span>' : ''}</td></tr>`
        })
        .join('')
    const lRows = simon
        ? ''
        : D.ks.l
              .map((v, i) => {
                  const fromKey = i < m - 1
                  return `<tr${fromKey ? ' class="cur"' : ''}><td class="num">${i}</td><td class="hex">${hexw(v, n)}</td><td>${fromKey ? `key[${i + 1}] = ℓ${sub(i)}, straight from the key` : `line 57, iteration i = ${i - (m - 1)}`}</td></tr>`
              })
              .join('')
    el.innerHTML = `
  <p class="prose">A cipher with T rounds needs T <dfn>round keys</dfn> (one n-bit word mixed in per round), but the key only has m words. The <dfn>key schedule</dfn> stretches the key: ${
      simon
          ? `${C('simon_round_keys')} (lines 23–34) uses the key words as k[0] to k[${m - 1}], then computes each later key from earlier ones with rotations, XOR and one bit of a fixed sequence Z[${D.j}].`
          : `${C('speck_round_keys')} (lines 50–59) uses key[0] as k[0], then runs SPECK's own round function on the pair (l[i], k[i]) with the counter i as its "round key".`
  }</p>
  ${
      simon
          ? `<p class="prose">Z[${D.j}] adds a different 0 or 1 to each new key. Without it, keys built by the same rule could repeat in a pattern, which some attacks exploit. The five sequences are the first lines of the file; this variant uses the highlighted one, Z[${D.j}]:</p>
  ${codeView([[1, 5]], { on: D.j + 1 })}`
          : ''
  }
  <div id="ksDbg"></div>
  <details><summary>All ${T} round keys</summary><div class="inner">
    <p class="muted">Highlighted rows come straight from the key; every other key is computed by the loop.</p>
    <div class="tbl"><table><thead><tr><th scope="col" class="num">i</th><th scope="col">k[i] (hex)</th><th scope="col">Where it comes from</th></tr></thead><tbody>${rkRows}</tbody></table></div>
  </div></details>
  ${
      simon
          ? ''
          : `<details><summary>The l words (${D.ks.l.length} of them)</summary><div class="inner">
    <p class="muted">The schedule's second list. Its first m − 1 = ${m - 1} entries come from the key; the loop appends one per iteration.</p>
    <div class="tbl"><table><thead><tr><th scope="col" class="num">index</th><th scope="col">l[index] (hex)</th><th scope="col">Where it comes from</th></tr></thead><tbody>${lRows}</tbody></table></div>
  </div></details>`
  }`
    const st = new Stepper($('#ksDbg', el), {
        name: 'ks',
        label: 'Loop iteration',
        pos: ksPos,
        codeLabel: simon
            ? 'ref.py lines 23–34, simon_round_keys'
            : 'ref.py lines 50–59, speck_round_keys',
    })
    st.setIters(
        simon ? simonKeyIters() : speckKeyIters(),
        simon ? [[23, 34]] : [[50, 59]],
    )
}

const roundPos = { it: 0, st: 0 }

function changedNote(a, b, n) {
    const d = popcount(a ^ b)
    return `${d} of ${n} bits changed`
}
function roundSummary(R, n) {
    return `<p class="note">Round ${R.r}: (x, y) = (${hx(R.x, n)}, ${hx(R.y, n)}) → (${hx(R.nx, n)}, ${hx(R.ny, n)}). ${popcount(R.nx ^ R.x) + popcount(R.ny ^ R.y)} of the block's ${2 * n} bits changed.</p>`
}

function simonRoundSteps(R) {
    const n = S.n,
        T = D.T,
        kn = `k = k[${R.r - 1}]`
    return [
        {
            line: 40,
            say: `Round ${R.r} of ${T}: the loop hands this round its key, ${kn}. The state coming in is ${R.r === 1 ? 'the plaintext' : `the output of round ${R.r - 1}`}.`,
            body: vars(
                ruler(n),
                row('x', R.x, n),
                row('y', R.y, n),
                row(kn, R.k, n),
            ),
        },
        {
            line: 36,
            say: `${C('simon_f(x, n)')} is called with v = x. It starts with rol(v, 1, n): x rotated left by 1.`,
            body: vars(
                ruler(n),
                row('v = x', R.x, n),
                row('rol(v, 1, n)', R.s1, n, {
                    res: true,
                    mark: lowBits(1),
                    sub: 'underlined bit wrapped round',
                }),
            ),
        },
        {
            line: 36,
            say: `rol(v, 8, n) rotates the same v left by 8.`,
            body: vars(
                ruler(n),
                row('v = x', R.x, n),
                row('rol(v, 8, n)', R.s8, n, {
                    res: true,
                    mark: lowBits(8),
                    sub: 'underlined bits wrapped round',
                }),
            ),
        },
        {
            line: 36,
            say: `rol(v, 1, n) & rol(v, 8, n) keeps a 1 only where both rotated copies have a 1. ${NONLIN}`,
            body:
                vars(
                    ruler(n),
                    row('rol(v, 1, n)', R.s1, n),
                    row('rol(v, 8, n)', R.s8, n, { op: '&' }),
                    row('rol(v, 1, n) & rol(v, 8, n)', R.and, n, { res: true }),
                ) +
                `<p class="note">XOR and rotation are linear: flipping one input bit always flips the same output bits, whatever the other bits are. AND is not: flipping a bit of one input matters only where the other input has a 1. Without this step, SIMON could be solved like a set of linear equations.</p>`,
        },
        {
            line: 36,
            say: `rol(v, 2, n) rotates v left by 2.`,
            body: vars(
                ruler(n),
                row('v = x', R.x, n),
                row('rol(v, 2, n)', R.s2, n, {
                    res: true,
                    mark: lowBits(2),
                    sub: 'underlined bits wrapped round',
                }),
            ),
        },
        {
            line: 36,
            say: `simon_f returns the AND XORed with rol(v, 2, n), so f(x) = ${hx(R.f, n)}.`,
            body: vars(
                ruler(n),
                row('rol(v, 1, n) & rol(v, 8, n)', R.and, n),
                row('rol(v, 2, n)', R.s2, n, { op: '^' }),
                row('simon_f(x, n)', R.f, n, { res: true }),
            ),
        },
        {
            line: 41,
            say: `The new x is y ^ simon_f(x, n) ^ k. Python evaluates the whole right-hand side with the old x before it assigns anything. Outlined bits differ from the old x.`,
            body: vars(
                ruler(n),
                row('y', R.y, n),
                row('simon_f(x, n)', R.f, n, { op: '^' }),
                row(kn, R.k, n, { op: '^' }),
                row('new x', R.nx, n, {
                    res: true,
                    diff: R.nx ^ R.x,
                    sub: changedNote(R.nx, R.x, n) + ' vs old x',
                }),
            ),
        },
        {
            line: 41,
            say: `The new y is the old x, copied unchanged. Swapping the halves like this is what makes SIMON a Feistel cipher. Outlined bits differ from the old y.`,
            body:
                vars(
                    ruler(n),
                    row('old x', R.x, n),
                    row('new y', R.ny, n, {
                        res: true,
                        diff: R.ny ^ R.y,
                        sub: changedNote(R.ny, R.y, n) + ' vs old y',
                    }),
                ) + roundSummary(R, n),
        },
    ]
}

function speckRoundSteps(R) {
    const n = S.n,
        T = D.T,
        [a, b] = speckAB(n),
        kn = `k = k[${R.r - 1}]`,
        cols = n + 1
    return [
        {
            line: 64,
            say: `Round ${R.r} of ${T}: the loop hands this round its key, ${kn}. The state coming in is ${R.r === 1 ? 'the plaintext' : `the output of round ${R.r - 1}`}.`,
            body: vars(
                ruler(n),
                row('x', R.x, n),
                row('y', R.y, n),
                row(kn, R.k, n),
            ),
        },
        {
            line: 65,
            say: `ror(x, a, n) rotates x right by a = ${a}.`,
            body: vars(
                ruler(n),
                row('x', R.x, n),
                row('ror(x, a, n)', R.rorx, n, {
                    res: true,
                    mark: highBits(a, n),
                    sub: 'underlined bits wrapped round',
                }),
            ),
        },
        {
            line: 65,
            say: `ror(x, a, n) + y adds y to it. The sum can need ${n + 1} bits, so & mask drops the carry out of the top. ${NONLIN}`,
            body:
                vars(
                    ruler(n, cols),
                    row('ror(x, a, n)', R.rorx, n, { cols }),
                    row('y', R.y, n, { cols, op: '+' }),
                    row('carries', R.carries, n, {
                        cols,
                        over: 1,
                        acc: true,
                        sub: 'a coloured cell is a carry into that bit',
                    }),
                    row('ror(x, a, n) + y', R.sum, n, {
                        cols,
                        over: 1,
                        res: true,
                        sub:
                            R.sum >> BigInt(n)
                                ? 'the hatched top bit is the carry out'
                                : 'no carry out of the top this time',
                    }),
                    row('(…) & mask', R.masked, n, { cols, res: true }),
                ) +
                `<p class="note">Each bit of a sum depends on every lower bit, through the chain of carries. That dependence is not linear, and it is the only nonlinear step in SPECK; everything else is rotation and XOR.</p>`,
        },
        {
            line: 65,
            say: `XOR with the round key gives the new x. Outlined bits differ from the old x.`,
            body: vars(
                ruler(n),
                row('(ror(x, a, n) + y) & mask', R.masked, n),
                row(kn, R.k, n, { op: '^' }),
                row('new x', R.nx, n, {
                    res: true,
                    diff: R.nx ^ R.x,
                    sub: changedNote(R.nx, R.x, n) + ' vs old x',
                }),
            ),
        },
        {
            line: 66,
            say: `rol(y, b, n) rotates the old y left by b = ${b}.`,
            body: vars(
                ruler(n),
                row('y', R.y, n),
                row('rol(y, b, n)', R.roly, n, {
                    res: true,
                    mark: lowBits(b),
                    sub: 'underlined bits wrapped round',
                }),
            ),
        },
        {
            line: 66,
            say: `XOR with x, which line 65 has already replaced with the new x, gives the new y. Outlined bits differ from the old y.`,
            body:
                vars(
                    ruler(n),
                    row('rol(y, b, n)', R.roly, n),
                    row('x (new)', R.nx, n, { op: '^' }),
                    row('new y', R.ny, n, {
                        res: true,
                        diff: R.ny ^ R.y,
                        sub: changedNote(R.ny, R.y, n) + ' vs old y',
                    }),
                ) + roundSummary(R, n),
        },
    ]
}

function renderOneRound(el) {
    const simon = S.cipher === 'simon',
        [a, b] = speckAB(S.n)
    el.innerHTML = `
  <p class="prose">The loop body in ${C(S.cipher + '_encrypt')} is one <dfn>round</dfn>. Pick a round with the slider and step through it. In the paper's notation, where S<sup>j</sup> means rotate left by j and S<sup>−j</sup> rotate right:</p>
  <div class="callout"><p class="mono" style="margin:0">${
      simon
          ? `f(x) = (S<sup>1</sup>x &amp; S<sup>8</sup>x) ⊕ S<sup>2</sup>x<br>(x, y) → (y ⊕ f(x) ⊕ k, x)`
          : `x → (S<sup>−${a}</sup>x + y) ⊕ k<br>y → S<sup>${b}</sup>y ⊕ x   (using the new x)`
  }</p></div>
  <div id="roundDbg"></div>`
    const st = new Stepper($('#roundDbg', el), {
        name: 'round',
        label: 'Round',
        pos: roundPos,
        codeLabel: simon
            ? 'ref.py lines 36–42, simon_f and simon_encrypt'

    })
    st.setIters(
        D.rounds.map((R) => ({
            label: `round ${R.r} of ${D.T}`,
            steps: (simon ? simonRoundSteps : speckRoundSteps)(R),
        })),
        simon ? [[36, 42]] : [[61, 67]],
    )
}

const filmUI = { changes: false, sel: 1, hover: -1 }

function encryptCallSteps() {
    const { n, cipher, x, y } = S,
        simon = cipher === 'simon',
        T = D.T,
        w = (v) => hx(v, n)
    const list = `[${S.key.map(w).join(', ')}]`,
        cmp = D.isPaper ? ` It matches the paper's test vector.` : ''
    return simon
        ? [
              {
                  line: 38,
                  say: `${C('simon_encrypt')} is called with x = ${w(x)}, y = ${w(y)}, key = ${C(list)} and n = ${n}.`,
              },
              {
                  line: 39,
                  say: `${C('_check')} passes; this time it also checks that x and y fit in ${n} bits.`,
              },
              {
                  line: 40,
                  say: `${C('simon_round_keys(key, n)')} runs once and returns ${T} round keys. The for loop then takes them one at a time, so the body runs ${T} times.`,
              },
              {
                  line: 41,
                  say: `Each pass is one round: the new pair (x, y) replaces the old one. The film strip below shows the state after every pass.`,
              },
              {
                  line: 42,
                  say: `After ${T} rounds the function returns (x, y) = (${w(D.cx)}, ${w(D.cy)}): the ciphertext.${cmp}`,
              },
          ]
        : [
              {
                  line: 61,
                  say: `${C('speck_encrypt')} is called with x = ${w(x)}, y = ${w(y)}, key = ${C(list)} and n = ${n}.`,
              },
              {
                  line: 62,
                  say: `${C('_check')} passes; this time it also checks that x and y fit in ${n} bits.`,
              },
              {
                  line: 63,
                  say: `a, b = ${D.a}, ${D.b} since n is ${n}, and mask = ${w(D.mask)}.`,
              },
              {
                  line: 64,
                  say: `${C('speck_round_keys(key, n)')} runs once and returns ${T} round keys. The for loop then takes them one at a time, so the body runs ${T} times.`,
              },
              { line: 65, say: `Each pass replaces x first (line 65)…` },
              {
                  line: 66,
                  say: `…and then y, using the new x (line 66). The film strip below shows the state after every pass.`,
              },
              {
                  line: 67,
                  say: `After ${T} rounds the function returns (x, y) = (${w(D.cx)}, ${w(D.cy)}): the ciphertext.${cmp}`,
              },
          ]
}

function drawFilm(canvas) {
    const n = S.n,
        states = D.states,
        cols = 2 * n,
        rows = states.length
    const avail = Math.max(240, canvas.parentElement.clientWidth - 2)
    const labelW = 30,
        gap = 6,
        head = 16
    const cell = clamp(Math.floor((avail - labelW - gap) / cols), 3, 14)
    const rowH = clamp(cell, 5, 12)
    const W = labelW + cols * cell + gap,
        H = head + rows * rowH
    const dpr = window.devicePixelRatio || 1
    canvas.width = Math.round(W * dpr)
    canvas.height = Math.round(H * dpr)
    canvas.style.width = W + 'px'
    canvas.style.height = H + 'px'
    const g = canvas.getContext('2d')
    g.setTransform(dpr, 0, 0, dpr, 0, 0)
    const col = {
        b1: cssVar('--bit1'),
        b0: cssVar('--bit0'),
        acc: cssVar('--accent'),
        ink: cssVar('--ink-3'),
        bg: cssVar('--panel'),
    }
    g.fillStyle = col.bg
    g.fillRect(0, 0, W, H)
    g.font = '10px ' + cssVar('--mono', document.documentElement)
    g.fillStyle = col.ink
    g.textBaseline = 'middle'
    g.textAlign = 'center'
    g.fillText('x', labelW + (n * cell) / 2, head / 2)
    g.fillText('y', labelW + gap + n * cell + (n * cell) / 2, head / 2)
    g.textAlign = 'right'
    const every = rowH >= 10 ? 1 : rowH >= 7 ? 2 : 4
    for (let r = 0; r < rows; r++) {
        const [x, y] = states[r],
            v = (x << BigInt(n)) | y
        const prev = r ? (states[r - 1][0] << BigInt(n)) | states[r - 1][1] : v,
            d = v ^ prev
        const top = head + r * rowH
        if (r % every === 0 || r === rows - 1) {
            g.fillStyle = col.ink
            g.fillText(r === 0 ? 'in' : String(r), labelW - 6, top + rowH / 2)
        }
        for (let c = 0; c < cols; c++) {
            const p = BigInt(cols - 1 - c),
                bit = (v >> p) & 1n,
                ch = (d >> p) & 1n
            g.fillStyle =
                filmUI.changes && r > 0
                    ? ch
                        ? col.acc
                        : bit
                          ? col.b1
                          : col.b0
                    : bit
                      ? col.b1
                      : col.b0
            if (filmUI.changes && r > 0 && !ch) g.globalAlpha = 0.35
            g.fillRect(
                labelW + c * cell + (c >= n ? gap : 0),
                top,
                Math.max(1, cell - 1),
                Math.max(1, rowH - 1),
            )
            g.globalAlpha = 1
        }
    }
    for (const [r, style, wdt] of [
        [filmUI.hover, col.ink, 1.5],
        [filmUI.sel, col.acc, 2.5],
    ]) {
        if (r < 0 || r >= rows) continue
        g.strokeStyle = style
        g.lineWidth = wdt
        g.strokeRect(
            labelW - 2,
            head + r * rowH - 1,
            cols * cell + gap + 3,
            rowH + 1,
        )
    }
    canvas._geo = { head, rowH, rows }
}

function renderAllRounds(el) {
    const { n, cipher } = S,
        simon = cipher === 'simon',
        T = D.T
    filmUI.sel = clamp(filmUI.sel, 0, T)
    const pc = D.paperCt,
        match = D.cx === pc[0] && D.cy === pc[1]
    el.innerHTML = `
  <p class="prose">${C(cipher + '_encrypt')} is short: check the inputs, build the round keys, run the round T = ${T} times, return the result. Step through it:</p>
  <div id="encDbg"></div>
  <h3>Film strip: the state after every round</h3>
  <p class="prose">Each row is the ${2 * n}-bit block (x then y) after one round; the top row, "in", is the plaintext. Click a row, or focus the strip and use ↑ ↓ and Enter, to open that round in chapter 6.</p>
  <label class="nowrap" style="font-size:.9rem"><input type="checkbox" id="filmChanges"${filmUI.changes ? ' checked' : ''}> Colour the bits that changed since the previous row</label>
  <div class="canvas-wrap"><canvas class="strip" id="film" tabindex="0" role="img" aria-label="Film strip of ${T + 1} states, ${2 * n} bits each. Use the arrow keys to choose a round and Enter to open it."></canvas></div>
  <p id="filmInfo" class="note" aria-live="polite"></p>
  <h3>The result</h3>
  <dl class="kv">
    <dt>returned</dt><dd>(x, y) = (${hx(D.cx, n)}, ${hx(D.cy, n)})</dd>
    <dt>as the paper writes it</dt><dd>${hexw(D.cx, n)} ${hexw(D.cy, n)}</dd>
    <dt>paper's test vector</dt><dd>${D.vec[3]}${D.isPaper ? '' : ' (for different inputs)'}</dd>
  </dl>
  ${
      D.isPaper
          ? `<p class="${match ? 'match' : 'match no'}">${match ? "✓ Matches the paper's test vector for " + D.name + '.' : "✗ Does not match the paper's test vector."}</p>`
          : `<p class="note">Your inputs differ from the paper's test vector for ${D.name}, so there is no published answer to compare with. Choose "Use the paper's test vector" in ${chLink('inputs')} to check against the paper.</p>`
  }
  <details><summary>Table of all ${T} rounds</summary><div class="inner"><div class="tbl"><table>
    <thead><tr><th scope="col" class="num">Round</th><th scope="col">Round key k</th><th scope="col">x after</th><th scope="col">y after</th><th scope="col"><span class="sr">Open</span></th></tr></thead>
    <tbody><tr><td class="num">in</td><td class="muted">—</td><td class="hex">${hexw(S.x, n)}</td><td class="hex">${hexw(S.y, n)}</td><td></td></tr>
    ${D.rounds.map((R) => `<tr><td class="num">${R.r}</td><td class="hex">${hexw(R.k, n)}</td><td class="hex">${hexw(R.nx, n)}</td><td class="hex">${hexw(R.ny, n)}</td><td><button type="button" class="btn small" data-round="${R.r}">Open</button></td></tr>`).join('')}</tbody>
  </table></div></div></details>`

    const st = new Stepper($('#encDbg', el), {
        name: 'enc',
        label: 'Call',
        noSlider: true,
        codeLabel: simon
            ? 'ref.py lines 38–42, simon_encrypt'
            : 'ref.py lines 61–67, speck_encrypt',
    })
    st.setIters(
        [{ label: 'call', steps: encryptCallSteps() }],
        simon ? [[38, 42]] : [[61, 67]],
    )

    const cv = $('#film', el),
        info = $('#filmInfo', el)
    const openRound = (r) => {
        roundPos.it = clamp(r, 1, T) - 1
        roundPos.st = 0
        CH[5].v = -1
        go('one-round')
    }
    const describe = (r) => {
        const [x, y] = D.states[r]
        info.textContent =
            r === 0
                ? `Plaintext: x = ${hx(x, n)}, y = ${hx(y, n)}.`
                : `After round ${r} (key k[${r - 1}] = ${hx(D.rk[r - 1], n)}): x = ${hx(x, n)}, y = ${hx(y, n)}.`
    }
    const rowAt = (e) => {
        const g = cv._geo,
            rect = cv.getBoundingClientRect()
        const r = Math.floor((e.clientY - rect.top - g.head) / g.rowH)
        return r >= 0 && r < g.rows ? r : -1
    }
    drawFilm(cv)
    describe(filmUI.sel)
    cv.addEventListener('mousemove', (e) => {
        const r = rowAt(e)
        if (r !== filmUI.hover) {
            filmUI.hover = r
            drawFilm(cv)
            if (r >= 0) describe(r)
        }
    })
    cv.addEventListener('mouseleave', () => {
        filmUI.hover = -1
        drawFilm(cv)
        describe(filmUI.sel)
    })
    cv.addEventListener('click', (e) => {
        const r = rowAt(e)
        if (r >= 0) openRound(Math.max(1, r))
    })
    cv.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault()
            filmUI.sel = clamp(
                filmUI.sel + (e.key === 'ArrowDown' ? 1 : -1),
                0,
                T,
            )
            drawFilm(cv)
            describe(filmUI.sel)
        } else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault()
            openRound(Math.max(1, filmUI.sel))
        }
    })
    $('#filmChanges', el).addEventListener('change', (e) => {
        filmUI.changes = e.target.checked
        drawFilm(cv)
    })
    el.querySelectorAll('[data-round]').forEach((b) =>
        b.addEventListener('click', () => openRound(+b.dataset.round)),
    )
    CH[6].redraw = () => drawFilm(cv)
}
